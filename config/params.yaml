slip_odom_node:
  ros__parameters:
    wheel_base: 0.23
    wheel_radius: 0.05
    encoder_mode: "A"
    window_size: 20
    imu_bias_calib_seconds: 3.0
    publish_tf: true
    use_sigmoid_params_fixed: true
    sigmoid_s0: 0.175
    sigmoid_k: 8.79

yahboom_base_node:
  ros__parameters:
    serial_port: "/dev/ttyUSB0"
    baudrate: 115200
    wheel_base: 0.23
    control_frequency: 50.0
    cmd_vel_timeout: 0.5
    max_linear_speed: 0.6
    max_angular_speed: 3.0
    channel_fl: 1
    channel_fr: 2
    channel_rl: 3
    channel_rr: 4
    invert_left: false
    invert_right: false
    publish_feedback: true
    apply_board_config: false
    motor_type: 0
    deadzone: 0
    encoder_lines: 0
    motor_phase: 0
    wheel_diameter_mm: 100
    upload_mall: 0
    upload_mtep: 1
    upload_mspd: 1

bno055_node:
  ros__parameters:
    i2c_bus: "/dev/i2c-1"
    i2c_address: 40
    frame_id: "imu_link"
    publish_frequency: 50.0
    operation_mode: 12
    orientation_covariance: [0.0025, 0.0025, 0.0025]
    angular_velocity_covariance: [0.0004, 0.0004, 0.0004]
    linear_acceleration_covariance: [0.0064, 0.0064, 0.0064]

experiment_runner:
  ros__parameters:
    mode: "figure8"
    duration: 30.0
    v: 0.3
    w: 0.8
    repeat: 1
    stop_at_end: true
